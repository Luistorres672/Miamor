<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <title>Flores Amarillas para Mi Amor 🌻</title>
  
  <style>
    :root {
      --primary-pink: #f8bbd0;
      --dark-pink: #ad1457;
      --highlight-pink: #f06292;
      --text-color: #880e4f;
      --flower-yellow: #ffd700;
      --flower-gold: #ffb300;
      --flower-yellow-pale: #ffe082;
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(255, 255, 255, 0.6);
      --shadow-color: rgba(173, 20, 87, 0.15);
    }

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      display: flex;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #fff0f5 0%, #fce4ec 50%, #f8bbd0 100%);
      overflow: hidden;
      position: relative;
    }

    /* Lluvia de pétalos canvas */
    #petalosCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Contenedor principal Glassmorphism */
    .container {
      width: 350px;
      max-width: 90vw;
      text-align: center;
      padding: 35px 25px;
      background: var(--glass-bg);
      border-radius: 35px;
      box-shadow: 0 20px 40px var(--shadow-color), 0 0 0 1px var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: relative;
      z-index: 10;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
    }

    /* Animación de apertura hacia flower.html */
    .container.open {
      transform: scale(0.85) translateY(-30px);
      opacity: 0;
      pointer-events: none;
    }

    /* Shake de error */
    .container.shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-12px); }
      40%, 80% { transform: translateX(12px); }
    }

    /* Header */
    .attempts-info {
      font-size: 0.85rem;
      color: var(--dark-pink);
      margin-bottom: 12px;
      font-weight: 500;
      min-height: 1.4rem;
      transition: all 0.3s ease;
    }

    .container h2 {
      font-size: 1.35rem;
      color: var(--text-color);
      margin-bottom: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .lock-icon {
      font-size: 2.2rem;
      display: inline-block;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
      transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .lock-icon.open {
      transform: scale(1.3) rotate(-20deg);
    }

    /* Pines Visuales */
    .pin-display {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 20px 0 30px;
      min-height: 40px;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--highlight-pink);
      background-color: transparent;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dot.filled {
      background-color: var(--dark-pink);
      border-color: var(--dark-pink);
      transform: scale(1.15);
      box-shadow: 0 0 10px rgba(173, 20, 87, 0.4);
    }

    .dot.error {
      background-color: #e53935;
      border-color: #e53935;
      animation: pulseError 0.3s ease infinite alternate;
    }

    .dot.success {
      background-color: var(--flower-gold);
      border-color: var(--flower-gold);
      box-shadow: 0 0 12px var(--flower-gold);
    }

    @keyframes pulseError {
      from { transform: scale(1); }
      to { transform: scale(1.25); }
    }

    /* Keypad Grid */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      justify-items: center;
    }

    .keypad button {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      font-size: 1.4rem;
      font-weight: 500;
      background: white;
      color: var(--dark-pink);
      border: 1px solid rgba(248, 187, 208, 0.6);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      outline: none;
      position: relative;
      overflow: hidden;
    }

    .keypad button:hover {
      background-color: #fff0f5;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(240, 98, 146, 0.25);
    }

    .keypad button:active {
      transform: translateY(2px) scale(0.92);
      background-color: var(--primary-pink);
      color: white;
    }

    .btn-action {
      font-size: 1.1rem !important;
      background-color: rgba(255, 255, 255, 0.5) !important;
      border-color: transparent !important;
    }

    /* Ripple Effect */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 215, 0, 0.5);
      transform: scale(0);
      animation: rippleAnim 0.5s linear;
      pointer-events: none;
    }

    @keyframes rippleAnim {
      to {
        transform: scale(3);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Canvas de lluvia de pétalos -->
  <canvas id="petalosCanvas"></canvas>

  <!-- Tarjeta interactiva -->
  <div class="container" id="mainContainer">
    <div class="attempts-info" id="attemptsInfo">Te quedan 3 besos 💋</div>
    
    <h2>
      <span class="lock-icon" id="lockIcon">🔒</span>
      Nuestra fecha especial
    </h2>

    <!-- Indicador de PIN -->
    <div class="pin-display" id="pinDisplay">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <!-- Teclado Numérico -->
    <div class="keypad">
      <button onclick="enterDigit(this, '1')">1</button>
      <button onclick="enterDigit(this, '2')">2</button>
      <button onclick="enterDigit(this, '3')">3</button>
      <button onclick="enterDigit(this, '4')">4</button>
      <button onclick="enterDigit(this, '5')">5</button>
      <button onclick="enterDigit(this, '6')">6</button>
      <button onclick="enterDigit(this, '7')">7</button>
      <button onclick="enterDigit(this, '8')">8</button>
      <button onclick="enterDigit(this, '9')">9</button>
      <button class="btn-action" onclick="clearAll()" title="Limpiar">C</button>
      <button onclick="enterDigit(this, '0')">0</button>
      <button class="btn-action" onclick="deleteDigit()" title="Borrar">⌫</button>
    </div>
  </div>

  <script>
    // Configuración inicial
    const correctPassword = "311023";
    const targetURL = "flower.html"; // Redirección al archivo externo
    
    let input = "";
    let attempts = 3;

    // Referencias al DOM
    const container = document.getElementById("mainContainer");
    const lockIcon = document.getElementById("lockIcon");
    const attemptsInfo = document.getElementById("attemptsInfo");
    const dots = document.querySelectorAll(".dot");

    // =========================================
    // Web Audio API para Efectos Sonoros
    // =========================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTone(freq, type, duration) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function soundKey() { playTone(520, 'sine', 0.1); }
    function soundDelete() { playTone(320, 'sine', 0.12); }
    function soundError() {
      playTone(180, 'sawtooth', 0.25);
      setTimeout(() => playTone(140, 'sawtooth', 0.3), 100);
    }
    function soundSuccess() {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        setTimeout(() => playTone(freq, 'triangle', 0.4), idx * 100);
      });
    }

    // =========================================
    // Lógica del Teclado
    // =========================================
    function updateDots(status = "normal") {
      dots.forEach((dot, index) => {
        dot.className = "dot";
        if (status === "error") {
          dot.classList.add("error");
        } else if (status === "success") {
          dot.classList.add("success");
        } else if (index < input.length) {
          dot.classList.add("filled");
        }
      });
    }

    function enterDigit(btn, digit) {
      if (input.length >= 6) return;
      
      soundKey();
      createRipple(btn);
      input += digit;
      updateDots();

      if (input.length === 6) {
        validatePassword();
      }
    }

    function deleteDigit() {
      if (input.length > 0) {
        soundDelete();
        input = input.slice(0, -1);
        updateDots();
      }
    }

    function clearAll() {
      if (input.length > 0) {
        soundDelete();
        input = "";
        updateDots();
      }
    }

    function validatePassword() {
      if (input === correctPassword) {
        // ÉXITO
        soundSuccess();
        lockIcon.textContent = "🔓";
        lockIcon.classList.add('open');
        container.classList.add('open');
        attemptsInfo.textContent = "¡Abierto con amor! 🌻";
        attemptsInfo.style.color = "var(--flower-gold)";
        updateDots("success");

        // Redirigir hacia flower.html
        setTimeout(() => {
          window.location.href = targetURL;
        }, 650);

      } else {
        // ERROR
        soundError();
        attempts--;
        container.classList.add('shake');
        updateDots("error");

        if (attempts > 0) {
          attemptsInfo.textContent = `Te quedan ${attempts} besos 💋`;
          if (attempts === 1) {
            attemptsInfo.textContent = "Pista: Nuestro Aniversario... 🤔";
            attemptsInfo.style.fontWeight = "600";
          }
        } else {
          attemptsInfo.textContent = "Se acabaron los besos... ¡intenta de nuevo! ❤️";
          attempts = 3;
        }

        setTimeout(() => {
          input = "";
          updateDots();
          container.classList.remove('shake');
        }, 600);
      }
    }

    function createRipple(button) {
      const circle = document.createElement("span");
      const diameter = Math.max(button.clientWidth, button.clientHeight);
      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `0px`;
      circle.style.top = `0px`;
      circle.classList.add("ripple");

      const ripple = button.getElementsByClassName("ripple")[0];
      if (ripple) ripple.remove();

      button.appendChild(circle);
    }

    // Soporte para teclado físico
    document.addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "9") {
        const btns = Array.from(document.querySelectorAll(".keypad button"));
        const btn = btns.find(b => b.textContent === e.key);
        if (btn) enterDigit(btn, e.key);
      } else if (e.key === "Backspace") {
        deleteDigit();
      } else if (e.key === "Escape" || e.key === "c" || e.key === "C") {
        clearAll();
      }
    });

    // =========================================
    // Canvas de Pétalos Flotantes
    // =========================================
    const canvas = document.getElementById("petalosCanvas");
    const ctx = canvas.getContext("2d");

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    class Petalo {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = -20;
        this.size = Math.random() * 8 + 6;
        this.speedY = Math.random() * 1.8 + 1;
        this.speedX = Math.random() * 1 - 0.5;
        this.rotation = Math.random() * 360;
        this.rotSpeed = Math.random() * 2 - 1;
        this.color = Math.random() > 0.4 ? "#ffd700" : "#ffe082";
        this.opacity = Math.random() * 0.6 + 0.4;
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.01) + this.speedX;
        this.rotation += this.rotSpeed;

        if (this.y > height + 20) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-this.size, -this.size, -this.size, this.size, 0, this.size * 1.5);
        ctx.bezierCurveTo(this.size, this.size, this.size, -this.size, 0, 0);
        ctx.fill();

        ctx.restore();
      }
    }

    const petalos = Array.from({ length: 45 }, () => new Petalo());

    function animate() {
      ctx.clearRect(0, 0, width, height);
      petalos.forEach((p) => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
